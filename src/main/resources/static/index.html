<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management System</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;700&display=swap" rel="stylesheet">


    <style>

        :root {
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.7);
            --input-bg: rgba(0, 0, 0, 0.2);
            --success-color: #10b981;
            --error-color: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 3.5rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 40px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 40px;
        }

        .box {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 40px;
            border: 1px solid var(--glass-border);
        }

        h2 {
            font-family: 'Outfit', sans-serif;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon {
            background: var(--glass-bg);
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
        }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 14px 18px;
            background: var(--input-bg);
            border-radius: 14px;
            border: 1px solid var(--glass-border);
            color: white;
        }

        button {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            background: var(--primary-gradient);
            border: none;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        ul {
            list-style: none;
            max-height: 400px;
            overflow-y: auto;
        }

        li {
            background: rgba(255,255,255,0.05);
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }

        .badge {
            background: rgba(168,85,247,0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .info-banner {
            margin-bottom: 20px;
            color: var(--text-muted);
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
        }

        .loading {
            text-align: center;
            padding: 30px;
        }
    </style>
</head>

<body>

<h1>User Management</h1>

<div class="container">

    <!-- CREATE USER -->
    <div class="box">
        <h2><span class="icon">✨</span>Create New User</h2>

        <div class="form-group">
            <label>Name</label>
            <input id="name">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input id="email">
        </div>

        <div class="form-group">
            <label>Department</label>
            <input id="department">
        </div>

        <button onclick="createUser()">Create User</button>
        <div id="createMsg"></div>
    </div>

    <!-- SEARCH (ELASTICSEARCH) -->
    <div class="box">
        <h2><span class="icon">🔍</span>Search Directory</h2>

        <div class="info-banner">
            Search users by name or department
        </div>

        <input
                id="searchQuery"
                placeholder="Type to search..."
                onkeyup="searchUsers()"
        >

        <ul id="searchResults">
            <div class="empty-state">Start typing to search users</div>
        </ul>
    </div>

    <!-- ✅ NEW SECTION: SEARCH BY DEPARTMENT ID -->
    <div class="box">
        <h2><span class="icon">🏷️</span>Search by Department ID</h2>

        <div class="info-banner">
            Fetch users belonging to a specific department ID
        </div>

        <input
                id="deptIdInput"
                placeholder="Enter Department ID (e.g. 1)"
                onkeyup="searchByDepartmentId()"
        >

        <ul id="deptSearchResults">
            <div class="empty-state">
                Enter a department ID to search users
            </div>
        </ul>
    </div>

</div>

<script>
    function createUser() {
     const msg = document.getElementById("createMsg");

     const nameInput = document.getElementById("name");
     const emailInput = document.getElementById("email");
     const deptInput = document.getElementById("department");

     const user = {
         name: nameInput.value.trim(),
         email: emailInput.value.trim(),
         department: {
             name: deptInput.value.trim()
         }
     };

     fetch("http://localhost:8080/createUser", {
         method: "POST",
         headers: { "Content-Type": "application/json" },
         body: JSON.stringify(user)
     })
     .then(res => {
         if (!res.ok) {
             return res.text().then(err => { throw err });
         }
         return res.json();
     })
     .then(() => msg.innerText = "User created successfully")
     .catch(err => msg.innerText = "Error: " + err);
 }


     function searchUsers() {
         const q = searchQuery.value.trim();
         if (!q) return;

         fetch(`/search?q=${encodeURIComponent(q)}`)
             .then(res => res.json())
             .then(data => {
                 searchResults.innerHTML = "";
                 data.forEach(u => {
                     searchResults.innerHTML += `
                         <li>
                             <div>${u.name}<br>${u.email || ""}</div>
                             <span class="badge">${u.departmentName}</span>
                         </li>`;
                 });
             });
     }

     function searchByDepartmentId() {
         const id = deptIdInput.value.trim();

         if (!id) return;

         fetch(`/departmentSearchById?departmentId=${id}`)
             .then(res => res.json())
             .then(data => {
                 deptSearchResults.innerHTML = "";
                 data.forEach(u => {
                     deptSearchResults.innerHTML += `
                         <li>
                             <div>${u.name}<br>${u.email}</div>
                             <span class="badge">${u.departmentName}</span>
                         </li>`;
                 });
             });
     }
</script>

</body>
</html>
