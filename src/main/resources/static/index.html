<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.7);
            --input-bg: rgba(0, 0, 0, 0.2);
            --success-color: #10b981;
            --error-color: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            background-image:
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%),
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Ambient Background Animation */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(99, 102, 241, 0.15) 0%, transparent 50%);
            animation: pulse-glow 15s infinite alternate;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes pulse-glow {
            0% { transform: scale(0.8) translate(0, 0); opacity: 0.5; }
            100% { transform: scale(1.1) translate(20px, 20px); opacity: 0.8; }
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 3.5rem;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: -1px;
            filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.3));
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 40px;
            padding: 20px;
        }

        .box {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: var(--glass-shadow);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.27), box-shadow 0.4s ease;
        }

        .box:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.2);
        }

        h2 {
            font-family: 'Outfit', sans-serif;
            color: var(--text-main);
            margin-bottom: 30px;
            font-size: 1.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--glass-border);
        }

        .icon {
            font-size: 1.6rem;
            background: var(--glass-bg);
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        label {
            display: block;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            margin-left: 4px;
        }

        input {
            width: 100%;
            padding: 16px 20px;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            font-size: 1rem;
            color: white;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        input:focus {
            outline: none;
            border-color: #a855f7;
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.1);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        button {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 16px;
            background: var(--primary-gradient);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
        }

        button::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(168, 85, 247, 0.4);
        }

        button:hover::after {
            left: 100%;
        }

        button:active {
            transform: scale(0.98);
        }

        /* Search Section Specifics */
        .info-banner {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.2);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 25px;
            color: #c7d2fe;
            font-size: 0.9rem;
        }

        .search-wrapper {
            position: relative;
            margin-bottom: 25px;
        }

        .search-input {
            padding-left: 20px;
            background: rgba(0,0,0, 0.3);
        }

        ul {
            list-style: none;
            max-height: 450px;
            overflow-y: auto;
            padding-right: 5px;
        }

        /* Custom Scrollbar */
        ul::-webkit-scrollbar {
            width: 6px;
        }

        ul::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        ul::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        ul::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        li {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            padding: 16px 20px;
            border-radius: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        li:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-weight: 600;
            color: white;
            font-size: 1.05rem;
            margin-bottom: 4px;
        }

        .user-detail {
            color: var(--text-muted);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge {
            background: rgba(168, 85, 247, 0.2);
            color: #d8b4fe;
            border: 1px solid rgba(168, 85, 247, 0.3);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* Feedback Messages */
        #createMsg {
            margin-top: 15px;
            border-radius: 12px;
            font-size: 0.9rem;
            text-align: center;
            overflow: hidden;
            transition: all 0.3s ease;
            opacity: 0;
            height: 0;
            padding: 0;
        }

        #createMsg:not(:empty) {
            opacity: 1;
            height: auto;
            padding: 12px;
            margin-top: 20px;
        }

        .success-message {
            background: rgba(16, 185, 129, 0.2) !important;
            color: #6ee7b7 !important;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.2) !important;
            color: #fca5a5 !important;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            border: 2px dashed var(--glass-border);
            border-radius: 16px;
            background: rgba(0,0,0,0.1);
        }

        .empty-state::before {
            content: "🔍";
            display: block;
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.5;
            filter: grayscale(1);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        .loading::after {
            content: '';
            display: block;
            width: 40px;
            height: 40px;
            margin: 20px auto 0;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #a855f7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>User Management</h1>
</div>

<div class="container">
    <!-- CREATE USER -->
    <div class="box">
        <h2>
            <span class="icon">✨</span>
            Create New User
        </h2>

        <div class="form-group">
            <label for="name">Name</label>
            <input id="name" placeholder="Ex: Alex Johnson" autocomplete="off">
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input id="email" type="email" placeholder="alex@company.com" autocomplete="off">
        </div>

        <div class="form-group">
            <label for="department">Department</label>
            <input id="department" placeholder="Ex: Engineering" autocomplete="off">
        </div>

        <button onclick="createUser()">
            Create Account
        </button>
        <div id="createMsg"></div>
    </div>

    <!-- SEARCH USERS -->
    <div class="box">
        <h2>
            <span class="icon">🔍</span>
            Search Directory
        </h2>

        <div class="info-banner">
            Search users by name or department
        </div>

        <div class="search-wrapper">
            <input
                    id="searchQuery"
                    class="search-input"
                    placeholder="Type to search..."
                    onkeyup="searchUsers()"
                    autocomplete="off"
            >
        </div>

        <ul id="searchResults">
            <!-- Results will appear here -->
            <div class="empty-state">
                <div class="empty-state-text">Start typing to search users...</div>
            </div>
        </ul>
    </div>
</div>

<script>
    // CREATE USER
    function createUser() {
        const nameInput = document. getElementById("name");
        const emailInput = document.getElementById("email");
        const deptInput = document.getElementById("department");
        const msg = document.getElementById("createMsg");

        const user = {
            name: nameInput.value. trim(),
            email: emailInput. value. trim(),
            department: {
                name: deptInput.  value.trim()
            }
        };

        if (!  user.name || ! user.email || !user.department. name) {
            msg.className = "error-message";
            msg.innerText = "⚠️ All fields are required";
            return;
        }

        fetch("/createUser", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON. stringify(user)
        })
        .then(res => {
            if (! res.ok) throw new Error("Failed to create user");
            return res.json();
        })
        .then(() => {
            msg.className = "success-message";
            msg.innerText = "✅ User created successfully!  ";

            nameInput.value = "";
            emailInput.value = "";
            deptInput.value = "";

            // Clear message after 3 seconds
            setTimeout(() => {
                msg.innerText = "";
                msg.className = "";
            }, 3000);
        })
        .catch(err => {
            msg.className = "error-message";
            msg.innerText = "❌ " + err.message;
        });
    }

    // UNIFIED SEARCH
    function searchUsers() {
        const query = document.  getElementById("searchQuery").value.trim();
        const list = document.getElementById("searchResults");

        // Clear results if input is empty
        if (! query) {
            list.innerHTML = "";
            return;
        }

        // Show loading state
        list.innerHTML = '<div class="loading">Searching...</div>';

        fetch(`/search?q=${encodeURIComponent(query)}`)
            .then(res => {
                if (!res.ok) {
                    throw new Error("Failed to fetch users");
                }
                return res.json();
            })
            .then(data => {
                list.innerHTML = "";

                if (data.length === 0) {
                    list.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-text">No users found matching "${query}"</div>
                        </div>
                    `;
                    return;
                }

                data.forEach(user => {
                    const li = document.createElement("li");

                    li.innerHTML = `
                        <div class="user-info">
                            <div class="user-name">${user.name}</div>
                            ${user.email ? `<div class="user-detail">${user.email}</div>` : ""}
                        </div>
                        <span class="badge">${user.departmentName || "N/A"}</span>
                    `;

                    list.appendChild(li);
                });
            })
            .catch(err => {
                console.error("Search error:", err);
                list.  innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-text">⚠️ Error loading results</div>
                    </div>
                `;
            });
    }
</script>

</body>
</html>
